spring:
  cloud:
    gateway:
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY
            methods: GET, POST
            backoff:
              firstBackoff: 1s
              maxBackoff: 5s
              factor: 2
              basedOnPreviousValue: true
      # Auth routes match production precedence; legacy /api/auth supports existing route tests.
      routes:
        - id: devnogi-auth-server-public
          uri: lb://auth-service
          predicates:
            - Path=/das/api/auth/login,/das/api/auth/refresh,/das/api/auth/register,/das/api/auth/logout
          filters:
            - StripPrefix=1

        - id: devnogi-auth-server-oauth-start
          uri: lb://auth-service
          predicates:
            - Path=/das/oauth2/authorization/**
          filters:
            - StripPrefix=1

        - id: devnogi-auth-server
          uri: lb://auth-service
          predicates:
            - Path=/das/**
          filters:
            - StripPrefix=1
            - name: JwtAuthentication
              args:
                secretKey: bWVtb25vZ2ktbG9jYWwtb25seS1zeW50aGV0aWMta2V5LTIwMjY=
                issuer: devnogi

        - id: devnogi-auth-server-legacy
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2

        - id: devnogi-auth-server-oauth
          uri: lb://auth-service
          predicates:
            - Path=/login/oauth2/code/**

        - id: open-api-batch-server
          uri: lb://open-api-batch-service
          predicates:
            - Path=/api/statics/**
          filters:
            - StripPrefix=2

        - id: devnogi-community-server
          uri: lb://community-service
          predicates:
            - Path=/api/community/**
          filters:
            - StripPrefix=2

    # SimpleDiscoveryClient 설정도 테스트에 필요하므로 그대로 둡니다.
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: http://localhost:8081
            open-api-batch-service:
              - uri: http://localhost:8083
            community-service:
              - uri: http://localhost:8082

# 프레임워크 DEBUG에는 인증 요청 URI와 헤더가 포함될 수 있다.
logging:
  level:
    org.springframework.cloud.gateway: WARN
    reactor.netty.http.client: WARN
